services:
  # One-shot init container: makes sure the data volume is owned by the image's
  # non-root user (UID 65532). Needed when an existing volume is still owned by
  # root (e.g. from an older, root-based image version). It runs briefly as root,
  # fixes the permissions and exits.
  init-permissions:
    image: alpine:3
    command: ["chown", "-R", "65532:65532", "/appdata"]
    volumes:
      - forecast-data:/appdata
    restart: "no"

  forecast:
    image: ghcr.io/daknoblo/forecast-tool:latest
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    container_name: forecast-tool
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FORECAST_ADDR: ":8080"
      FORECAST_DATA_DIR: "/appdata"
      TZ: "Europe/Berlin"
      # Optional: API key for the AI endpoint, via host env or a .env file.
      # FORECAST_AI_API_KEY: "${FORECAST_AI_API_KEY}"
      # Optional: bearer tokens for the JSON API (/api/v1, see docs/API.md).
      # FORECAST_API_READ_TOKEN: "${FORECAST_API_READ_TOKEN}"
      # FORECAST_API_WRITE_TOKEN: "${FORECAST_API_WRITE_TOKEN}"
    volumes:
      - forecast-data:/appdata
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  forecast-data:
