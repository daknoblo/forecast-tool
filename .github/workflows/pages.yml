name: Pages

# Publishes the documentation site: rendered Markdown, an automatically
# captured screenshot gallery and a clickable static snapshot of the
# application running on generated demo data. Everything is rebuilt from
# scratch on every build. Authors maintain prose; UI references are generated.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deployment: GitHub Pages allows only one at a time.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs, demo & screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/screenshots/package-lock.json

      - name: Install screenshot tooling
        working-directory: tools/screenshots
        run: npm ci

      - name: Install Chromium
        working-directory: tools/screenshots
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: |
          go run ./cmd/docsite -out site -language en -require-screenshots
          go run ./cmd/docsite -out site-de -language de -require-screenshots

      - name: Test documentation builder
        run: go test -race ./internal/docsite ./cmd/docsite

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview-${{ github.sha }}
          path: |
            site
            site-de
          include-hidden-files: true
          retention-days: 14

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # site/.nojekyll is hidden and would otherwise be dropped.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
